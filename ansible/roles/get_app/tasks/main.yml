# ==================================================
# Download App
# ==================================================
>>>>>>> ca35b9b (Integrate Ansible Vault and update Jenkins Ansible environment)

- block:

    - name: Download app
      command:
        cmd: >
          timeout 900
          bench get-app
          {% if branch is defined and branch | length > 0 %}
          --branch {{ branch }}
          {% endif %}
          {{ app_name }}
          {{ repo_url }}
        chdir: "{{ bench_path }}"
      register: get_app_result
      when: not app_check.stat.exists

    - name: Show download output
      debug:
        var: get_app_result.stdout_lines
      when:
        - get_app_result is defined
        - not app_check.stat.exists

  rescue:

    - name: Download failed
      fail:
        msg: "Failed to download {{ app_name }}"

# ==================================================
# Verify
# ==================================================

- name: Verify app downloaded
  stat:
    path: "{{ bench_path }}/apps/{{ app_name }}"
  register: verify_app

- name: Fail if app missing
  fail:
    msg: "App {{ app_name }} was not downloaded"
  when: not verify_app.stat.exists

# ==================================================
# Success
# ==================================================

- name: App downloaded successfully
  debug:
    msg: "App {{ app_name }} downloaded successfully"
  when:
    - verify_app.stat.exists
    - not app_check.stat.exists

- name: App already exists
  debug:
    msg: "App {{ app_name }} already exists"
  when: app_check.stat.exists
