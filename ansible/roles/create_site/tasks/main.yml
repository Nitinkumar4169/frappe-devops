---
- name: Check if site exists
  stat:
    path: "{{ bench_path }}/sites/{{ site_name }}"
  register: site_check

- name: Create Frappe Site
  command:
    cmd: >
      bench new-site {{ site_name }}
      --admin-password {{ admin_password }}
      --mariadb-root-password {{ mariadb_root_password }}
    chdir: "{{ bench_path }}"
  when: not site_check.stat.exists

- name: Setting up nginx
  command:
    cmd: >
      bench setup nginx --yes
    chdir: "{{ bench_path }}"
  when: not site_check.stat.exists

- name: Wait before nginx reload
  pause:
    seconds: 5

- name: Reload Nginx
  become: true
  systemd:
    name: nginx
    state: reloaded

- name: Setup Let's Encrypt SSL
  become: true
  command:
    cmd: bench setup lets-encrypt {{ site_name }} --non-interactive
    chdir: "{{ bench_path }}"
  when:
    - not site_check.stat.exists
    - enable_ssl | default(false) | bool
  register: letsencrypt_result
  changed_when: "'Certificate' in letsencrypt_result.stdout or letsencrypt_result.rc == 0"

- name: Success Message
  debug:
    msg:
      - "Site created successfully"
      - "Site Name : {{ site_name }}"
      - "SSL Enabled : {{ enable_ssl | default(false) }}"
